name: Android native
on:
  push:
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and verify the separate native app
        run: bash ./gradlew --no-daemon --console=plain :app:assembleOptimized :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :smoke:assembleOptimized
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restaurangkassa-native-test
          path: android-native/app/build/outputs/apk/optimized/app-optimized.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-test-results
          path: |
            android-native/app/build/reports/
            android-native/app/build/outputs/mapping/optimized/
