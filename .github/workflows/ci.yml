name: Verify training POS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Runtime upgrades require the matching reviewed upstream Node LICENSE.
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run test:safe-env
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-check-${{ matrix.os }}
          path: |
            playwright-report/
            artifacts/
          retention-days: 7
